<!DOCTYPE html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 360px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        color: #e0e0e0;
        background: #282828;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid #3c3c3c;
      }

      .header h1 {
        font-size: 14px;
        font-weight: 600;
      }

      .tab-count {
        background: #4285f4;
        color: #fff;
        border-radius: 10px;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 600;
      }

      .tab-list {
        max-height: 320px;
        overflow-y: auto;
        padding: 4px 0;
      }

      .tab-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        border-bottom: 1px solid #333;
      }

      .tab-item img {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .tab-info {
        overflow: hidden;
        min-width: 0;
      }

      .tab-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 500;
      }

      .tab-url {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #888;
        font-size: 11px;
        margin-top: 2px;
      }

      .actions {
        padding: 12px 16px;
        display: flex;
        gap: 8px;
        border-top: 1px solid #3c3c3c;
      }

      button {
        flex: 1;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }

      .btn-primary {
        background: #4285f4;
        color: #fff;
      }

      .btn-primary:hover {
        background: #5a9bff;
      }

      .btn-secondary {
        background: #3c3c3c;
        color: #e0e0e0;
      }

      .btn-secondary:hover {
        background: #4a4a4a;
      }

      .copied {
        background: #34a853 !important;
      }

      .empty-state {
        padding: 24px 16px;
        text-align: center;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Copy Tab Links</h1>
      <span class="tab-count" id="count">0</span>
    </div>
    <div class="tab-list" id="tabList"></div>
    <div class="actions">
      <button class="btn-secondary" id="copyUrls">URLs only</button>
      <button class="btn-primary" id="copyBoth">Copy Title + URL</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
