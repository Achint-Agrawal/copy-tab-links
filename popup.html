<!DOCTYPE html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 360px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        color: #e0e0e0;
        background: #282828;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid #3c3c3c;
      }

      .header h1 {
        font-size: 14px;
        font-weight: 600;
      }

      .tab-count {
        background: #4285f4;
        color: #fff;
        border-radius: 10px;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 600;
      }

      .tab-list {
        max-height: 320px;
        overflow-y: auto;
        padding: 4px 0;
      }

      .tab-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        border-bottom: 1px solid #333;
      }

      .tab-item img {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .tab-info {
        overflow: hidden;
        min-width: 0;
      }

      .tab-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 500;
      }

      .tab-url {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #888;
        font-size: 11px;
        margin-top: 2px;
      }

      .actions {
        padding: 12px 16px;
        display: flex;
        gap: 8px;
        border-top: 1px solid #3c3c3c;
      }

      .custom-format {
        padding: 12px 16px;
        border-top: 1px solid #3c3c3c;
      }

      .custom-format label {
        display: block;
        margin-bottom: 6px;
        color: #bdbdbd;
        font-size: 12px;
      }

      .custom-format input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #4a4a4a;
        border-radius: 6px;
        background: #1f1f1f;
        color: #e0e0e0;
        font: inherit;
      }

      .custom-format .separator-label {
        margin-top: 10px;
      }

      .custom-format input:focus {
        outline: 1px solid #4285f4;
        border-color: #4285f4;
      }

      .custom-format button {
        width: 100%;
        margin-top: 8px;
      }

      button {
        flex: 1;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #3c3c3c;
        color: #e0e0e0;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }

      button:hover {
        background: #5a9bff;
        color: #fff;
      }

      .copied {
        background: #34a853 !important;
      }

      .empty-state {
        padding: 24px 16px;
        text-align: center;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Copy Tab Links</h1>
      <span class="tab-count" id="count">0</span>
    </div>
    <div class="tab-list" id="tabList"></div>
    <div class="actions">
      <button class="btn-secondary" id="copyUrls">URLs only</button>
      <button class="btn-secondary" id="copyBoth">Copy Title + URL</button>
      <button class="btn-secondary" id="copyMarkdown">Markdown links</button>
    </div>
    <div class="custom-format">
      <label for="customFormat">Custom format</label>
      <input
        id="customFormat"
        type="text"
        placeholder="- [<title>](<URL>)"
        aria-describedby="customFormatHelp"
      />
      <label class="separator-label" for="customSeparator">Separator</label>
      <input
        id="customSeparator"
        type="text"
        placeholder="\n"
        aria-describedby="customFormatHelp"
      />
      <button id="copyCustom">Copy Custom Format</button>
      <small id="customFormatHelp">
        Use &lt;title&gt; and &lt;URL&gt; as placeholders. Separators support
        \n, \t, and \\.
      </small>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
